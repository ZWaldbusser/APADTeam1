name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 * * * *'   # every hour — adjust as you like
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} \
            --source ZWaldbusser/APADTeam1 \
            --branch main
